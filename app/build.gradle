plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.novapay'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')

    violationRules {
        rule {
            element = 'BUNDLE'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

tasks.register('printCoverage') {
    dependsOn tasks.named('jacocoTestReport')

    doLast {
        def reportFile = file("$buildDir/reports/jacoco/test/jacocoTestReport.xml")

        if (!reportFile.exists()) {
            throw new GradleException(
                "JaCoCo XML report not found: ${reportFile}"
            )
        }

        def report = new XmlSlurper().parse(reportFile)

        println ""
        println "=========================================="
        println "       NovaPay JaCoCo Coverage"
        println "=========================================="

        report.counter.each { counter ->
            def missed = counter.@missed.toBigInteger()
            def covered = counter.@covered.toBigInteger()
            def total = missed + covered

            def percentage = total > 0
                ? (covered * 100.0 / total)
                : 0.0

            println String.format(
                "%-8s : %.2f%%",
                counter.@type.toString(),
                percentage
            )
        }

        println "=========================================="
        println "Required:"
        println "LINE   >= 80%"
        println "BRANCH >= 70%"
        println "=========================================="
        println ""
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}