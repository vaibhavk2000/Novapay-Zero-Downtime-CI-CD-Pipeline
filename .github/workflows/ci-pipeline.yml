name: NovaPay CI/CD

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  GRADLE_VERSION: "8.8"
  IMAGE_NAME: novapay

jobs:
  source-validation:
    name: Source Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required project files
        run: |
          test -f app/build.gradle
          test -f app/settings.gradle
          test -f Dockerfile
          test -f pipeline/helm/novapay/Chart.yaml
          test -f pipeline/policies/require-probes.rego
          test -f pipeline/policies/require-nonroot.rego
