name: NovaPay CI Pipeline

on:
  push:
    branches:
      - main
      - "release/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: novapay

jobs:

  # ============================================================
  # STAGE 1 - SOURCE VALIDATION
  # ============================================================

  source-validation:
    name: Stage 1 - Source Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository files
        run: |
          echo "Validating repository..."

          test -f README.md
          test -f Dockerfile
          test -f app/build.gradle
          test -f app/settings.gradle

          echo "Repository validation passed."

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2


  # ============================================================
  # STAGE 2 - BUILD
  # ============================================================

  build:
    name: Stage 2 - Build Application
    needs: source-validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle
        run: |
          gradle --version

      - name: Build application
        run: |
          gradle clean build -x test --no-daemon

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: novapay-application
          path: app/build/libs/*.jar


  # ============================================================
  # STAGE 3 - TESTING
  # ============================================================

  test:
    name: Stage 3 - Unit Testing
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          gradle test --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/


  # ============================================================
  # STAGE 4 - SAST
  # ============================================================

  sast:
    name: Stage 4 - Static Security Analysis
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default


  # ============================================================
  # STAGE 5 - DEPENDENCY SECURITY SCAN
  # ============================================================

  dependency-scan:
    name: Stage 5 - Dependency Security Scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # STAGE 6 - CONTAINER BUILD AND SECURITY SCAN
  # ============================================================

  container-build:
    name: Stage 6 - Container Build and Scan

    needs:
      - test
      - sast
      - dependency-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # STAGE 7 - POLICY VALIDATION
  # ============================================================

  policy-validation:
    name: Stage 7 - Policy and Compliance Validation
    needs: container-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.56.0"

          curl -L \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o conftest.tar.gz

          tar xzf conftest.tar.gz

          sudo mv conftest /usr/local/bin/conftest

          conftest --version

      - name: Validate Kubernetes policies
        run: |
          conftest test \
            pipeline/helm/novapay/templates \
            --policy pipeline/policies


  # ============================================================
  # STAGE 8 - DEPLOYMENT VERIFICATION
  # ============================================================

  deployment-verification:
    name: Stage 8 - Deployment Verification
    needs: policy-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Simulated deployment verification
        run: |
          echo "Starting deployment verification..."

          echo "Checking application readiness..."
          echo "Checking application liveness..."
          echo "Running smoke tests..."
          echo "Checking HTTP error rate..."
          echo "Checking p99 latency..."

          echo "Deployment verification completed."

      - name: Generate pipeline evidence
        run: |
          mkdir -p evidence/test-results

          cat > evidence/test-results/pipeline-summary.txt << EOF
          Pipeline Run ID: ${{ github.run_id }}
          Repository: ${{ github.repository }}
          Commit SHA: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow: NovaPay CI Pipeline

          Completed Stages:
          1. Source Validation
          2. Build
          3. Unit Testing
          4. Static Security Analysis
          5. Dependency Security Scan
          6. Container Build and Scan
          7. Policy Validation
          8. Deployment Verification
          EOF

      - name: Upload pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: evidence/test-results/