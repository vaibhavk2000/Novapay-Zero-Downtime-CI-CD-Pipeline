name: NovaPay CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NovaPay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Check Java version
        run: java -version

      - name: Check Gradle version
        run: gradle --version

      - name: Show dependency versions
        working-directory: app
        run: |
          gradle dependencies --configuration runtimeClasspath

      - name: Build JAR
        working-directory: app
        run: |
          gradle clean bootJar --no-daemon

      - name: Verify JAR
        run: |
          echo "Generated JAR files:"
          ls -lh app/build/libs/

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t novapay:${{ github.sha }} \
            .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
