name: NovaPay CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NovaPay
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Build Spring Boot JAR
      - name: Build JAR
        working-directory: app
        run: |
          gradle clean bootJar --no-daemon

      # 5. Verify JAR exists
      - name: Verify JAR
        run: |
          echo "Generated JAR files:"
          ls -lh app/build/libs/

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          echo "Building NovaPay Docker image..."
          docker build \
            -t novapay:${{ github.sha }} \
            .

      # 7. Run Trivy
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
