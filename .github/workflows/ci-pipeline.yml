          test -f pipeline/policies/require-readonly-rootfs.rego
>>>>>>> 6c5a403 (update in project)

      - name: Show repository structure
        run: |
          find . -maxdepth 4 -type f | sort

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: source-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  test-and-coverage:
    name: Test and Coverage Gate
    runs-on: ubuntu-latest
    needs: source-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Check Java version
        run: java -version

      - name: Build application
        working-directory: app
        run: |
          gradle clean build --no-daemon

      - name: Run tests
        working-directory: app
        run: |
          gradle test --no-daemon

      - name: Generate JaCoCo coverage report
        working-directory: app
        run: |
          gradle jacocoTestReport --no-daemon

      - name: Enforce coverage gate
        working-directory: app
        run: |
          gradle jacocoTestCoverageVerification --no-daemon

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/jacoco/
          if-no-files-found: warn

  sast:
    name: SAST and Code Quality
    runs-on: ubuntu-latest
    needs: source-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: source-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  container-security:
    name: Container Build and Security
    runs-on: ubuntu-latest
    needs:
      - test-and-coverage
      - sast
      - dependency-scan
      - secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build application JAR
        working-directory: app
        run: |
          gradle clean bootJar --no-daemon

      - name: Verify generated JAR
        run: |
          ls -lh app/build/libs/

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          artifact-name: novapay-sbom.spdx.json

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          scanners: vuln

  policy-validation:
    name: Policy and Compliance Validation
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.58.0
          curl -L \
            -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Show policy and Helm files
        run: |
          echo "Available policy files:"
          find pipeline/policies -type f
          echo "Available Helm files:"
          find pipeline/helm/novapay -type f

      - name: Render Helm manifests
        run: |
          helm template novapay \
            pipeline/helm/novapay \
            > rendered-manifests.yaml

      - name: Run policy validation
        run: |
          echo "Running policy validation..."
          conftest test \
            rendered-manifests.yaml \
            --policy pipeline/policies

  deploy-nonprod:
    name: Deploy to Non-Production
    runs-on: ubuntu-latest
    needs: policy-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        run: |
          test -f pipeline/helm/novapay/Chart.yaml
          test -f pipeline/helm/novapay/templates/deployment.yaml
          test -f pipeline/helm/novapay/templates/service.yaml

      - name: Simulate non-production deployment
        run: |
          echo "Deploying NovaPay to non-production environment"
          echo "Image: $IMAGE_NAME:${{ github.sha }}"
          echo "Deployment validation completed"

  dast-and-smoke:
    name: DAST and Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-nonprod
    steps:
      - name: Smoke test validation
        run: |
          echo "Running smoke test validation"
          echo "Checking application deployment requirements"
          echo "Smoke tests passed"

      - name: DAST validation
        run: |
          echo "Running DAST validation stage"
          echo "Live DAST target is not configured"
          echo "DAST validation completed"

  progressive-production:
    name: Progressive Production Deployment
    runs-on: ubuntu-latest
    needs: dast-and-smoke
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Canary deployment
        run: |
          echo "Starting canary deployment"
          echo "Deploying initial production version"

      - name: Verify canary
        run: |
          echo "Checking canary health"
          echo "Canary verification passed"

      - name: Expand rollout
        run: |
          echo "Expanding traffic to production deployment"

      - name: Complete production deployment
        run: |
          echo "Production rollout completed successfully"

  post-deployment-verification:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: progressive-production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify application health
        run: |
          echo "Verifying application readiness"
          echo "Verifying application liveness"
          echo "Post-deployment verification passed"

      - name: Check rollback procedure
        run: |
          test -f pipeline/scripts/rollback.sh
          echo "Rollback procedure available"

  evidence-archival:
    name: Evidence Archival
    runs-on: ubuntu-latest
    needs:
      - test-and-coverage
      - container-security
      - policy-validation
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Archive project evidence
        uses: actions/upload-artifact@v4
        with:
          name: novapay-pipeline-evidence
          path: |
            evidence/
            docs/
            runbooks/
          if-no-files-found: warn
