name: NovaPay CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NovaPay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check Java version
        run: java -version

      - name: Check Gradle version
        working-directory: app
        run: ./gradlew --version

      - name: Show dependency versions
        working-directory: app
        run: |
          ./gradlew dependencies --configuration runtimeClasspath

      - name: Build JAR
        working-directory: app
        run: |
          ./gradlew clean bootJar --no-daemon

      - name: Verify JAR
        run: |
          echo "Generated JAR files:"
          ls -lh app/build/libs/

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t novapay:${{ github.sha }} \
            .

      - name: Inspect Docker image
        run: |
          echo "=== Docker image ==="
          docker image inspect novapay:${{ github.sha }}

          echo "=== OS ==="
          docker run --rm novapay:${{ github.sha }} \
            sh -c 'cat /etc/os-release'

          echo "=== Pebble ==="
          docker run --rm novapay:${{ github.sha }} \
            sh -c 'ls -lah /usr/bin/pebble 2>/dev/null || echo "Pebble NOT FOUND"'

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
