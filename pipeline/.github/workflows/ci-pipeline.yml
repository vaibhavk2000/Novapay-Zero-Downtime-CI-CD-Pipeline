name: NovaPay CI Pipeline

on:
  push:
    branches:
      - main
      - "release/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: "21"
  MIN_LINE_COVERAGE: "80"
  MIN_BRANCH_COVERAGE: "70"
  IMAGE_NAME: novapay

jobs:

  source-validation:
    name: Stage 1 - Source Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Validate repository
        run: |
          echo "Validating source repository"
          test -f README.md
          test -f Dockerfile

  build:
    name: Stage 2 - Build
    needs: source-validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: ./gradlew clean build -x test --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: novapay-application
          path: app/build/libs/*.jar

  test-coverage:
    name: Stage 3 - Testing and Coverage
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Verify tests
        run: |
          echo "All tests must pass"
          test -d build/test-results

  sast:
    name: Stage 4 - SAST
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  dependency-scan:
    name: Stage 5 - Dependency Scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: app
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  container-build:
    name: Stage 6 - Container Build and Scan
    needs:
      - test-coverage
      - sast
      - dependency-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  policy-validation:
    name: Stage 7 - Policy Validation
    needs: container-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
          -o conftest.tar.gz

          tar xzf conftest.tar.gz

          sudo mv conftest /usr/local/bin/

      - name: Validate Kubernetes policies
        run: |
          conftest test \
            pipeline/helm/novapay/templates \
            --policy pipeline/policies

  deployment-verification:
    name: Stage 8 - Deployment Verification
    needs: policy-validation
    runs-on: ubuntu-latest

    steps:
      - name: Deployment verification
        run: |
          echo "Deployment verification stage"

          echo "The production implementation will verify:"
          echo "- Kubernetes readiness"
          echo "- Kubernetes liveness"
          echo "- Smoke tests"
          echo "- Error rate"
          echo "- p99 latency"
          echo "- Canary analysis"

      - name: Archive pipeline evidence
        run: |
          mkdir -p evidence/test-results

          cat > evidence/test-results/pipeline-summary.txt <<EOF
          Pipeline Run: ${{ github.run_id }}
          Commit: ${{ github.sha }}
          Workflow: NovaPay CI Pipeline
          Result: Completed mandatory CI stages
          EOF

      - name: Upload pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: evidence/test-results/